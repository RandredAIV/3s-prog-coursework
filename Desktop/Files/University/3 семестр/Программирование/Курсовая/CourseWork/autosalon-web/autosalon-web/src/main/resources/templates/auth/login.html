<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <title>Вход — AVRAMCHUK BOLID MOTORSPORT</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>

    <style>
        :root {
            --f1-red: #e10600;
            --f1-dark: #0d0d0d;
            --f1-gray: #1a1a1a;

            --bg-main: var(--f1-dark);
            --card-bg: rgba(5, 10, 26, 0.96);

            --accent: var(--f1-red);
            --text-main: #ffffff;
            --text-muted: #c7c7c7;

            --border-subtle: rgba(255,255,255,0.12);
            --shadow-soft: 0 18px 45px rgba(0, 0, 0, 0.8);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
        }

        .page {
            max-width: 1280px;
            margin: 0 auto;
            padding: 24px 16px 40px;
        }

        /* ---------- Header ---------- */

        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 24px;
            margin: -24px -16px 32px;
            background: #111111;
            border-bottom: 2px solid var(--accent);
        }

        .app-brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-circle {
            width: 42px;
            height: 42px;
            border-radius: 999px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .logo-circle img {
            width: 120%;
            height: auto;
            object-fit: contain;
        }

        .brand-text-main {
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .brand-text-sub {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .nav-link {
            font-size: 13px;
            color: var(--text-muted);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding-bottom: 3px;
            border-bottom: 2px solid transparent;
        }

        .nav-link:hover {
            color: #ffffff;
        }

        .nav-link-active {
            color: #ffffff;
            border-bottom-color: var(--accent);
        }

        .auth-wrapper {
            margin-top: 40px;
            display: flex;
            justify-content: center;
        }

        .auth-card {
            width: 100%;
            max-width: 460px;
            background: var(--card-bg);
            border-radius: 22px;
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-soft);
            padding: 22px 22px 20px;
        }

        .auth-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .auth-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 18px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 13px;
            margin-bottom: 4px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 8px 12px;
            border-radius: 999px;
            border: 1px solid var(--border-subtle);
            background: #050817;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
        }

        input::placeholder {
            color: #7b7b7b;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px rgba(225, 6, 0, 0.7);
        }

        .btn-primary {
            width: 100%;
            margin-top: 6px;
            padding: 9px 14px;
            border-radius: 999px;
            border: none;
            background: var(--accent);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(225, 6, 0, 0.55);
        }

        .btn-primary:hover {
            background: #ff372f;
            box-shadow: 0 0 18px rgba(225, 6, 0, 0.75);
        }

        .auth-footer {
            margin-top: 14px;
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
        }

        .auth-footer a {
            color: var(--accent);
            text-decoration: none;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: rgba(225, 6, 0, 0.16);
            border: 1px solid rgba(225, 6, 0, 0.7);
            color: #ffe5e5;
            font-size: 13px;
            border-radius: 12px;
            padding: 9px 11px;
            margin-bottom: 12px;
        }

        .info-message {
            background: rgba(0, 200, 120, 0.14);
            border: 1px solid rgba(0, 220, 140, 0.7);
            color: #d1fae5;
            font-size: 13px;
            border-radius: 12px;
            padding: 9px 11px;
            margin-bottom: 12px;
        }

        @media (max-width: 768px) {
            .app-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .page {
                padding: 18px 12px 30px;
            }

            .auth-card {
                padding: 18px 16px 18px;
            }
        }
    </style>
</head>
<body>
<div class="page">

    <!-- Header -->
    <header class="app-header">
        <div class="app-brand">
            <div class="logo-circle">
                <img src="/images/f1-logo.png" alt="F1 Logo">
            </div>
            <div>
                <div class="brand-text-main">AVRAMCHUK BOLID MOTORSPORT</div>
                <div class="brand-text-sub">Коллекция легендарных болидов Формулы-1</div>
            </div>
        </div>

        <div class="header-right">
            <nav class="nav-links">
                <a href="/" class="nav-link">Главная</a>
                <a href="/login" class="nav-link nav-link-active">Вход</a>
                <a href="/register" class="nav-link">Регистрация</a>
            </nav>
        </div>
    </header>

    <section class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-title">Вход</div>
            <div class="auth-subtitle">
                Введите e-mail и пароль, чтобы перейти в каталог болидов.
            </div>

            <!-- Сообщение об ошибке авторизации -->
            <div th:if="${param.error}" class="error-message">
                Неверный e-mail или пароль.
            </div>

            <!-- Сообщение после выхода -->
            <div th:if="${param.logout}" class="info-message">
                Вы вышли из системы.
            </div>

            <!-- ВАЖНО: action=/login, method=post, CSRF-токен, name=email/password -->
            <form th:action="@{/login}" method="post">
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}"/>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input id="email" type="email" name="email" required autocomplete="username"
                           placeholder="you@example.com">
                </div>

                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input id="password" type="password" name="password" required autocomplete="current-password"
                           placeholder="Введите пароль">
                </div>

                <button type="submit" class="btn-primary">Войти</button>
            </form>

            <div class="auth-footer">
                Нет аккаунта?
                <a th:href="@{/register}">Зарегистрироваться</a>
            </div>
        </div>
    </section>

</div>
</body>
</html>
