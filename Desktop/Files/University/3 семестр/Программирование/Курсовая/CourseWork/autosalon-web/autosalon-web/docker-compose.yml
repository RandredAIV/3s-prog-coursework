services:
  db:
    container_name: autosalon_pg
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: autosalon
      POSTGRES_USER: autosalon
      POSTGRES_PASSWORD: autosalon
    ports:
      - "5433:5432"
    volumes:
      - db_data_autosalon:/var/lib/postgresql/data

volumes:
  db_data_autosalon:
